  const preview = document.querySelector('#face-preview');
  const controls = [...document.querySelectorAll('[data-layer]')];
  function applyVisibility() {
    controls.forEach(input => {
      preview.querySelector('#' + input.dataset.layer).style.display = input.checked ? '' : 'none';
    });
  }
  function showFace(name) {
    preview.innerHTML = faces[name];
    applyVisibility();
    document.querySelectorAll('[data-face]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.face === name)));
  }
  document.querySelectorAll('[data-face]').forEach(button => button.addEventListener('click', () => showFace(button.dataset.face)));
